when:
  event: push

steps:
  - name: test
    image: local
    commands:
      - cd /root/projects/eaglevault/EagleVault/android/upstream
      - ./gradlew :pass:eaglevault:api:test

  - name: build
    image: local
    commands:
      - cd /root/projects/eaglevault/EagleVault/android/upstream
      - ./gradlew :app:assembleDevDebug -PapkBuild=true -PdisableSentryUpload=true
