name = "eaglevault-core"
main = "src/index.mjs"
compatibility_date = "2026-08-06"
workers_dev = false
preview_urls = false
routes = [{ pattern = "api.eaglevault.eaglenet.asia", custom_domain = true }]

[vars]
CORS_ORIGINS = "https://eaglevault.eaglenet.asia"

[observability]
enabled = true

[[durable_objects.bindings]]
name = "VAULTS"
class_name = "VaultStore"

[[durable_objects.bindings]]
name = "RATE_LIMITS"
class_name = "RateLimitStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["VaultStore"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["RateLimitStore"]
