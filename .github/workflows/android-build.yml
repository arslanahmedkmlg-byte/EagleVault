name: Android CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"

permissions:
  contents: read

concurrency:
  group: eagle-vault-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out EagleVault
        uses: actions/checkout@v4

      - name: Check out pinned Bitwarden SDK
        uses: actions/checkout@v4
        with:
          repository: bitwarden/sdk-internal
          ref: 6238472451e4fa7b5c592b4b24a84e950a258957
          path: .ci/bitwarden-sdk
          persist-credentials: false

      - name: Set up pinned Rust for UniFFI generation
        run: rustup toolchain install 1.99.0 --profile minimal

      - name: Verify native SDK archives and generate Kotlin bindings
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash android/scripts/prepare-bitwarden-sdk.sh \
            .ci/bitwarden-sdk "$RUNNER_TEMP/bitwarden-zips" "$RUNNER_TEMP/bitwarden-sdk"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Set up Gradle and dependency cache
        uses: gradle/actions/setup-gradle@v4

      - name: Run EagleVault adapter tests and build APK
        working-directory: android/upstream
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --max-workers=2 \
            :pass:eaglevault:api:test \
            :app:assembleDevProdDebug \
            -PeagleVaultBitwardenSdkDir="$RUNNER_TEMP/bitwarden-sdk" \
            -PapkBuild=true \
            -PdisableSentryUpload=true

      - name: Verify Bitwarden libraries in the debug APK
        run: |
          shopt -s nullglob
          apks=(android/upstream/app/build/outputs/apk/devProd/debug/*.apk)
          test "${#apks[@]}" -eq 1
          for abi in arm64-v8a armeabi-v7a x86_64; do
            unzip -tq "${apks[0]}" "lib/$abi/libbitwarden_uniffi.so" "lib/$abi/libjnidispatch.so"
          done

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: eaglevault-android-dev-prod-debug
          path: android/upstream/app/build/outputs/apk/devProd/debug/*.apk
          if-no-files-found: error
          retention-days: 14
