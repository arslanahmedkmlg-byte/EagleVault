name: Android CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"

permissions:
  contents: read

concurrency:
  group: eagle-vault-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out EagleVault
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Set up Gradle and dependency cache
        uses: gradle/actions/setup-gradle@v4

      - name: Run EagleVault adapter tests and build APK
        working-directory: android/upstream
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --max-workers=2 \
            :pass:eaglevault:api:test \
            :app:assembleDevProdDebug \
            -PapkBuild=true \
            -PdisableSentryUpload=true

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: eaglevault-android-dev-prod-debug
          path: android/upstream/app/build/outputs/apk/devProd/debug/*.apk
          if-no-files-found: error
          retention-days: 14
